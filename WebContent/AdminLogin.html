<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | NITRTC</title>
    <link rel="stylesheet" href="UserHome_Css.css">
</head>
<body>
    <header>
        <div class="hd" style="background: linear-gradient(135deg, #f43f5e, #f97316); -webkit-background-clip: text;">NITRTC Admin</div>
        <nav class="home-container">
            <a href="index.html" class="menu">Back to Main Site</a>
        </nav>
    </header>

    <div class="container animate-up">
        <div class="hero">
            <h1 class="text-gradient" style="background: linear-gradient(135deg, #f43f5e, #f97316); -webkit-background-clip: text;">Admin Control Panel</h1>
            <p>Secure login for system administrators.</p>
            
            <div class="glass card" style="max-width: 450px; margin: 0 auto; text-align: left; padding: 2.5rem; border-color: rgba(244, 63, 94, 0.2);">
                <h2 style="margin-bottom: 1.5rem; font-size: 1.5rem; color: #fff;">Admin Authentication</h2>
                <form action="/adminlogin" method="POST">
                    <div class="form-group">
                        <label>Admin Email</label>
                        <input type="email" name="uname" placeholder="admin@demo.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="pword" placeholder="••••••••" required>
                    </div>
                    <button type="submit" style="background: linear-gradient(135deg, #f43f5e, #f97316); box-shadow: 0 4px 15px rgba(244, 63, 94, 0.3);">Authenticate</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
