<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | NITRTC</title>
    <link rel="stylesheet" href="UserHome_Css.css">
</head>
<body>
    <header>
        <div class="hd" style="background: linear-gradient(135deg, #f43f5e, #f97316); -webkit-background-clip: text;">NITRTC Admin</div>
        <nav class="home-container">
            <a href="AdminHome.html" class="menu active" style="background: rgba(244, 63, 94, 0.2); color: #fff;">Dashboard</a>
            <a href="ViewTrains.html" class="menu">Train Roster</a>
            <a href="index.html" class="menu" style="color: var(--accent);">Logout</a>
        </nav>
    </header>

    <div class="container animate-up">
        <div style="margin-bottom: 2rem;">
            <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">System <span class="text-gradient" style="background: linear-gradient(135deg, #f43f5e, #f97316); -webkit-background-clip: text;">Administration</span></h1>
            <p style="color: var(--text-muted); font-size: 1.1rem;">Manage the railway network and fleet.</p>
        </div>

        <div class="dashboard-grid">
            <!-- Add Train Form -->
            <div class="glass card" style="border-top: 4px solid #f43f5e;">
                <h2 class="card-title">🚂 Add New Train</h2>
                <form action="/adminaddtrain" method="POST">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label>Train Number</label>
                            <input type="number" name="trainno" placeholder="e.g. 10007" required>
                        </div>
                        <div class="form-group">
                            <label>Train Name</label>
                            <input type="text" name="trainname" placeholder="Express Name" required>
                        </div>
                        <div class="form-group">
                            <label>Origin Station</label>
                            <input type="text" name="fromstation" placeholder="e.g. DELHI" required>
                        </div>
                        <div class="form-group">
                            <label>Destination Station</label>
                            <input type="text" name="tostation" placeholder="e.g. MUMBAI" required>
                        </div>
                        <div class="form-group">
                            <label>Total Seats</label>
                            <input type="number" name="available" placeholder="e.g. 200" required>
                        </div>
                        <div class="form-group">
                            <label>Base Fare ($)</label>
                            <input type="number" step="0.01" name="fare" placeholder="e.g. 120.50" required>
                        </div>
                    </div>
                    <button type="submit" style="margin-top: 1rem; background: linear-gradient(135deg, #f43f5e, #f97316);">Register Train to Network</button>
                </form>
            </div>

            <!-- Admin Actions -->
            <div style="display: flex; flex-direction: column; gap: 2rem;">
                <div class="glass card">
                    <h2 class="card-title">🛠️ Fleet Management</h2>
                    <ul style="list-style: none; display: flex; flex-direction: column; gap: 1rem;">
                        <li><a href="AdminUpdateTrain.html" style="color: var(--text-main); text-decoration: none; padding: 1rem; background: rgba(0,0,0,0.2); border-radius: 8px; display: block;">Update Existing Train Schedule</a></li>
                        <li><a href="CancleTrain.html" style="color: var(--text-main); text-decoration: none; padding: 1rem; background: rgba(0,0,0,0.2); border-radius: 8px; display: block;">Cancel a Train</a></li>
                        <li><a href="ViewTrains.html" style="color: var(--text-main); text-decoration: none; padding: 1rem; background: rgba(0,0,0,0.2); border-radius: 8px; display: block;">View Complete Roster</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
