<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NITRTC | Premium Train Booking</title>
    <link rel="stylesheet" href="UserHome_Css.css">
</head>
<body>
    <header>
        <div class="hd">NITRTC</div>
        <nav class="home-container">
            <a href="#" class="menu active">Home</a>
            <a href="#about" class="menu">About</a>
            <a href="AdminLogin.html" class="menu">Admin Portal</a>
        </nav>
    </header>

    <div class="container animate-up">
        <div class="hero">
            <h1 class="text-gradient">The Future of<br>Train Travel is Here.</h1>
            <p>Experience seamless ticket booking with our lightning-fast, secure, and beautiful platform. Start your journey today.</p>
            
            <div class="glass card" style="max-width: 450px; margin: 0 auto; text-align: left; padding: 2.5rem;">
                <h2 style="margin-bottom: 1.5rem; font-size: 1.5rem;">Sign In</h2>
                <form action="/userlogin" method="POST" id="loginForm">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="uname" placeholder="hello@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="pword" placeholder="••••••••" required>
                    </div>
                    <button type="submit">Access Dashboard &rarr;</button>
                </form>
                <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
                    Don't have an account? <a href="UserRegister.html" style="color: var(--secondary); text-decoration: none;">Create one now</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            const btn = e.target.querySelector('button');
            btn.innerHTML = 'Authenticating...';
            btn.style.opacity = '0.7';
        });
    </script>
</body>
</html>
